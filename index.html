<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Milestone</title>
    <style>
        * {
            font-family: "Comic Sans MS", "Comic Sans", sans-serif !important;
        }

        body {
            background-color: transparent;
            color: #dcd0c0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #221a15;
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .icon {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .main-stat {
            font-size: 38px;
            font-weight: bold;
            color: #dcd0c0;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .subtext {
            font-size: 13px;
            color: #a89f91;
            line-height: 1.4;
            margin: 0;
        }

        @media (max-width: 768px) {
            body {
                height: auto;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon" id="icon-goal">🎯</div>
        <div class="main-stat">$10,000</div>
        <div class="subtext">Every little step brings you closer to financial freedom.</div>
    </div>

    <script>
        const icons = ['🎯', '🚀', '⭐', '🔥', '💎', '⚡', '🏆', '📈', '💰', '🌟'];
        
        function updateDynamicIcon() {
            const randomIcon = icons[Math.floor(Math.random() * icons.length)];
            document.getElementById('icon-goal').innerText = randomIcon;
        }

        // Shuffles icons very fast every 250 milliseconds
        setInterval(updateDynamicIcon, 250);
    </script>
</body>
</html>
